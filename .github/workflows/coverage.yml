name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  newclid-python-coverage:
    name: Newclid Python coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_ARGS: >-
        -DUSE_STATIC_LINK=OFF
        -DBUILD_DOC=OFF
        -DCMAKE_BUILD_TYPE=Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libboost-log-dev \
            libboost-json-dev \
            libboost-program-options-dev \
            libboost-test-dev \
            gcc-14 \
            g++-14 \
            ca-certificates

          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Sync full Python environment
        run: uv sync --frozen

      - name: Collect Newclid Python coverage
        run: |
          uv run pytest newclid/tests -q \
            --cov=newclid \
            --cov-report=xml:coverage/newclid-python.xml \
            --cov-report=html:coverage/newclid-python-html \
            --cov-report=term-missing

      - name: Upload Newclid coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newclid-python-coverage
          path: |
            coverage/newclid-python.xml
            coverage/newclid-python-html/
          if-no-files-found: ignore

  # C++ coverage is collected from a direct CMake/gcovr build instead of the
  # Python/uv package build. This keeps native Yuclid coverage focused on
  # yuclid/src and avoids mixing it with Python package coverage.
  yuclid-cpp-coverage:
    name: Yuclid C++ coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ coverage dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libboost-log-dev \
            libboost-json-dev \
            libboost-program-options-dev \
            libboost-test-dev \
            gcc-14 \
            g++-14 \
            ca-certificates

          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up Python for gcovr
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Configure Yuclid coverage build
        run: |
          rm -rf yuclid/build-coverage

          cmake \
            -S yuclid \
            -B yuclid/build-coverage \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUSE_STATIC_LINK=OFF \
            -DBUILD_DOC=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g -fprofile-abs-path" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build Yuclid coverage targets
        run: |
          cmake --build yuclid/build-coverage \
            --parallel "$(nproc)"

      - name: Clear old coverage counters
        run: find yuclid/build-coverage -name '*.gcda' -delete

      - name: Collect Yuclid C++ coverage with full CTest suite
        run: |
          ctest \
            --test-dir yuclid/build-coverage \
            --output-on-failure \
            --parallel "$(nproc)"

      - name: Generate Yuclid C++ coverage report
        run: |
          mkdir -p coverage/yuclid-cpp-html

          gcovr \
            --root "$GITHUB_WORKSPACE/yuclid" \
            --object-directory "$GITHUB_WORKSPACE/yuclid/build-coverage" \
            --gcov-executable gcov-14 \
            --filter "$GITHUB_WORKSPACE/yuclid/src" \
            --filter "$GITHUB_WORKSPACE/yuclid/include" \
            --exclude "$GITHUB_WORKSPACE/yuclid/tests" \
            --cobertura-pretty \
            --cobertura coverage/yuclid-cpp.xml \
            --html-details coverage/yuclid-cpp-html/index.html \
            --print-summary

      - name: Upload Yuclid C++ coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuclid-cpp-coverage
          path: |
            coverage/yuclid-cpp.xml
            coverage/yuclid-cpp-html/
          if-no-files-found: ignore

  yuclid-python-coverage:
    name: Yuclid Python coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_ARGS: >-
        -DUSE_STATIC_LINK=OFF
        -DBUILD_DOC=OFF
        -DCMAKE_BUILD_TYPE=Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libboost-log-dev \
            libboost-json-dev \
            libboost-program-options-dev \
            libboost-test-dev \
            gcc-14 \
            g++-14 \
            ca-certificates

          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Sync full Python environment and build Yuclid package
        run: uv sync --frozen

      - name: Collect Yuclid Python coverage
        run: |
          uv run pytest yuclid/tests -q \
            --cov=py_yuclid \
            --cov-report=xml:coverage/yuclid-python.xml \
            --cov-report=html:coverage/yuclid-python-html \
            --cov-report=term-missing

      - name: Upload Yuclid Python coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuclid-python-coverage
          path: |
            coverage/yuclid-python.xml
            coverage/yuclid-python-html/
          if-no-files-found: ignore

  # Coverage artifacts are always produced for inspection. Codacy upload is
  # best-effort and restricted to pushes on the canonical upstream repository so
  # forks and PRs do not need project tokens or publish duplicate coverage.
  upload-codacy-coverage:
    name: Upload coverage to Codacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - newclid-python-coverage
      - yuclid-cpp-coverage
      - yuclid-python-coverage
    if: always()

    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Prepare coverage reports directory
        run: mkdir -p coverage-reports

      - name: Download Newclid coverage
        if: ${{ needs.newclid-python-coverage.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: newclid-python-coverage
          path: coverage-reports/newclid

      - name: Download Yuclid C++ coverage
        if: ${{ needs.yuclid-cpp-coverage.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: yuclid-cpp-coverage
          path: coverage-reports/yuclid-cpp

      - name: Download Yuclid Python coverage
        if: ${{ needs.yuclid-python-coverage.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: yuclid-python-coverage
          path: coverage-reports/yuclid-python

      - name: List coverage reports
        run: find coverage-reports -maxdepth 8 -type f | sort

      - name: Upload Newclid coverage to Codacy
        continue-on-error: true
        if: >-
          ${{
            github.repository == 'Newclid/Newclid' &&
            github.event_name == 'push' &&
            env.CODACY_PROJECT_TOKEN != '' &&
            needs.newclid-python-coverage.result == 'success'
          }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-reports/newclid/newclid-python.xml

      - name: Upload Yuclid C++ coverage to Codacy
        continue-on-error: true
        if: >-
          ${{
            github.repository == 'Newclid/Newclid' &&
            github.event_name == 'push' &&
            env.CODACY_PROJECT_TOKEN != '' &&
            needs.yuclid-cpp-coverage.result == 'success'
          }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-reports/yuclid-cpp/yuclid-cpp.xml

      - name: Upload Yuclid Python coverage to Codacy
        continue-on-error: true
        if: >-
          ${{
            github.repository == 'Newclid/Newclid' &&
            github.event_name == 'push' &&
            env.CODACY_PROJECT_TOKEN != '' &&
            needs.yuclid-python-coverage.result == 'success'
          }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-reports/yuclid-python/yuclid-python.xml

      - name: Skip Codacy upload explanation
        if: >-
          ${{
            github.repository != 'Newclid/Newclid' ||
            github.event_name != 'push' ||
            env.CODACY_PROJECT_TOKEN == ''
          }}
        run: |
          echo "Skipping Codacy upload."
          echo "This is expected on pull requests, forks, or repositories without CODACY_PROJECT_TOKEN."
