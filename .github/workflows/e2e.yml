name: E2E
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend-backend:
    name: Frontend-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        # No engine needed: the test only checks that jobs get enqueued.
        run: |
          uv venv
          uv pip install -e "backend[test]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend and frontend
        run: |
          .venv/bin/python -m uvicorn newclid_backend.main:app \
            --app-dir backend/src --host 127.0.0.1 --port 8000 &
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 5173 &)
      - name: Run Playwright tests
        working-directory: frontend
        # uvicorn and vite were started in the background, so they may not be
        # listening yet. Wait for both to respond before starting Playwright,
        # otherwise the test hits a closed port and fails.
        run: |
          for url in http://127.0.0.1:8000/api/health http://127.0.0.1:5173; do
            for _ in $(seq 1 30); do curl -sf "$url" >/dev/null && break; sleep 1; done
          done
          npm run test:e2e:frontend-backend
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
