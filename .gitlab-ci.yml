workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          
    - when: never

stages:
  - test
  - integration


#############################
#                           #
#     Faster/unit jobs      #
#                           #
#############################
yuclid-compile-and-test-linux:
  stage: test
  timeout: 30m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
      - yuclid/tests/**/*
      changes:
        - yuclid/**/*
        - .gitlab-ci.yml
    - when: never

  variables:
    DEBIAN_FRONTEND: noninteractive

    CC: gcc-14
    CXX: g++-14

    CMAKE_GENERATOR: Ninja
    CMAKE_ARGS: >-
      -DUSE_STATIC_LINK=OFF
      -DBUILD_DOC=OFF
      -DCMAKE_BUILD_TYPE=Release

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      gcc-14
      g++-14
      ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p reports
    - export CMAKE_BUILD_PARALLEL_LEVEL="2"

  script:
    - echo "Sync Python environment and build Yuclid through uv/scikit-build"
    - uv sync --frozen -v

    - |
      echo "Find Yuclid CMake build directory created by scikit-build"

      YUCLID_BUILD_DIR="$(dirname "$(find yuclid/build -name CMakeCache.txt | head -n 1)")"

      if [ -z "$YUCLID_BUILD_DIR" ]; then
        echo "Could not find Yuclid CMake build directory"
        find yuclid -maxdepth 4 -type d
        exit 1
      fi

      echo "Yuclid build dir: $YUCLID_BUILD_DIR"

      echo "Make sure C++ test targets are built"
      cmake --build "$YUCLID_BUILD_DIR" --parallel "$(nproc)"

      echo "Run Yuclid CTest tests"
      ctest \
        --test-dir "$YUCLID_BUILD_DIR" \
        --output-on-failure \
        --parallel "$(nproc)" \
        --output-junit "$CI_PROJECT_DIR/reports/ctest-yuclid.xml"

    - echo "Run Yuclid Python tests"
    - uv run pytest yuclid/tests -q --junitxml=reports/pytest-yuclid.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/*.xml

backend-tests-linux:
  stage: test
  timeout: 10m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
        - backend/tests/unit/**/*
      changes:
        - backend/**/*
        - pytest.ini
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  before_script:
    - mkdir -p reports

  script:
    - echo "Create backend test environment"
    - uv venv
    - uv pip install -e "backend[test]"

    - echo "Run backend unit tests"
    - .venv/bin/python -m pytest backend/tests/unit -q --junitxml=reports/pytest-backend.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/pytest-backend.xml

frontend-build-linux:
  stage: test
  timeout: 10m
  image: node:22-bookworm-slim

  interruptible: true

  rules:
    - exists:
        - frontend/package.json
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci

    - echo "Build frontend"
    - npm run build

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/dist/

frontend-unit-tests-linux:
  stage: test
  timeout: 10m
  image: node:22-bookworm-slim
  interruptible: true

  rules:
    - exists:
        - frontend/tests/unit/**/*.test.ts
      changes:
        - frontend/src/**/*
        - frontend/tests/**/*
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.json
        - frontend/vite.config.ts
        - frontend/vitest.config.ts
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci
    - echo "Run frontend unit tests"
    - npm run test:unit:run

frontend-integration-tests-linux:
  stage: integration
  timeout: 10m
  image: node:22-bookworm-slim
  interruptible: true

  rules:
    - exists:
        - frontend/tests/integration/**/*.test.ts
      changes:
        - frontend/src/**/*
        - frontend/tests/**/*
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.json
        - frontend/vite.config.ts
        - frontend/vitest.config.ts
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci
    - echo "Run frontend integration tests"
    - npm run test:integration:run

#############################
#                           #
#     Integration jobs      #
#                           #
#############################
backend-integration-tests-linux:
  stage: integration
  timeout: 30m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
      - backend/tests/integration/**/*
      changes:
        - backend/**/*
        - yuclid/**/*
        - pytest.ini
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  services:
  - name: redis:7-alpine
    alias: redis

  variables:
    DEBIAN_FRONTEND: noninteractive

    CC: gcc-14
    CXX: g++-14

    CMAKE_GENERATOR: Ninja
    CMAKE_BUILD_PARALLEL_LEVEL: "2"
    CMAKE_ARGS: >-
      -DUSE_STATIC_LINK=OFF
      -DBUILD_DOC=OFF
      -DCMAKE_BUILD_TYPE=Release

    REDIS_URL: "redis://redis:6379/15"

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      gcc-14
      g++-14
      ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p reports

  script:
    - echo "Sync full environment and build Newclid/Yuclid"
    - uv sync --frozen -v

    - echo "Run backend integration tests"
    - uv run pytest backend/tests/integration -q --junitxml=reports/pytest-backend-integration.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/pytest-backend-integration.xml


docs-build-linux:
  stage: test
  timeout: 20m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim
  interruptible: true

  rules:
    - changes:
        - docs/**/*
        - newclid/**/*
        - ncdgen/**/*
        - yuclid/python/**/*
        - README.rst
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  variables:
    DEBIAN_FRONTEND: noninteractive

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      ca-certificates
    - rm -rf /var/lib/apt/lists/*

  script:
    - echo "Install project and documentation dependencies"
    - uv sync --frozen --extra doc

    - echo "Generate API documentation pages"
    - uv run python docs/reformat.py

    - echo "Build Sphinx documentation and fail on warnings"
    - uv run sphinx-build -b html -W --keep-going docs docs/_build/html

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - docs/_build/html/
