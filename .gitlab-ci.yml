workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          
    - when: never

stages:
  - test
  - integration


#############################
#                           #
#     Faster/unit jobs      #
#                           #
#############################
yuclid-compile-and-test-linux:
  stage: test
  timeout: 30m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
      - yuclid/tests/**/*
      changes:
        - yuclid/**/*
        - .gitlab-ci.yml
    - when: never

  variables:
    DEBIAN_FRONTEND: noninteractive

    CC: gcc-14
    CXX: g++-14

    CMAKE_GENERATOR: Ninja
    CMAKE_ARGS: >-
      -DUSE_STATIC_LINK=OFF
      -DBUILD_DOC=OFF
      -DCMAKE_BUILD_TYPE=Release

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      gcc-14
      g++-14
      ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p reports
    - export CMAKE_BUILD_PARALLEL_LEVEL="2"

  script:
    - echo "Sync Python environment and build Yuclid through uv/scikit-build"
    - uv sync --frozen -v

    - |
      echo "Find Yuclid CMake build directory created by scikit-build"

      YUCLID_BUILD_DIR="$(dirname "$(find yuclid/build -name CMakeCache.txt | head -n 1)")"

      if [ -z "$YUCLID_BUILD_DIR" ]; then
        echo "Could not find Yuclid CMake build directory"
        find yuclid -maxdepth 4 -type d
        exit 1
      fi

      echo "Yuclid build dir: $YUCLID_BUILD_DIR"

      echo "Make sure C++ test targets are built"
      cmake --build "$YUCLID_BUILD_DIR" --parallel "$(nproc)"

      echo "Run Yuclid CTest tests"
      ctest \
        --test-dir "$YUCLID_BUILD_DIR" \
        --output-on-failure \
        --parallel "$(nproc)" \
        --output-junit "$CI_PROJECT_DIR/reports/ctest-yuclid.xml"

    - echo "Run Yuclid Python tests"
    - uv run pytest yuclid/tests -q --junitxml=reports/pytest-yuclid.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/*.xml

backend-tests-linux:
  stage: test
  timeout: 10m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
        - backend/tests/unit/**/*
      changes:
        - backend/**/*
        - pytest.ini
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  before_script:
    - mkdir -p reports

  script:
    - echo "Create backend test environment"
    - uv venv
    - uv pip install -e "backend[test]"

    - echo "Run backend unit tests"
    - .venv/bin/python -m pytest backend/tests/unit -q --junitxml=reports/pytest-backend.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/pytest-backend.xml

frontend-build-linux:
  stage: test
  timeout: 10m
  image: node:22-bookworm-slim

  interruptible: true

  rules:
    - exists:
        - frontend/package.json
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci

    - echo "Build frontend"
    - npm run build

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/dist/

frontend-unit-tests-linux:
  stage: test
  timeout: 10m
  image: node:22-bookworm-slim
  interruptible: true

  rules:
    - exists:
        - frontend/tests/unit/**/*.test.ts
      changes:
        - frontend/src/**/*
        - frontend/tests/**/*
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.json
        - frontend/vite.config.ts
        - frontend/vitest.config.ts
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci
    - echo "Run frontend unit tests"
    - npm run test:unit:run

frontend-integration-tests-linux:
  stage: integration
  timeout: 10m
  image: node:22-bookworm-slim
  interruptible: true

  rules:
    - exists:
        - frontend/tests/integration/**/*.test.ts
      changes:
        - frontend/src/**/*
        - frontend/tests/**/*
        - frontend/package.json
        - frontend/package-lock.json
        - frontend/tsconfig.json
        - frontend/vite.config.ts
        - frontend/vitest.config.ts
        - .gitlab-ci.yml
    - when: never

  before_script:
    - cd frontend

  script:
    - echo "Install frontend dependencies"
    - npm ci
    - echo "Run frontend integration tests"
    - npm run test:integration:run

#############################
#                           #
#     Integration jobs      #
#                           #
#############################
backend-integration-tests-linux:
  stage: integration
  timeout: 30m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - exists:
      - backend/tests/integration/**/*
      changes:
        - backend/**/*
        - yuclid/**/*
        - pytest.ini
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  services:
  - name: redis:7-alpine
    alias: redis

  variables:
    DEBIAN_FRONTEND: noninteractive

    CC: gcc-14
    CXX: g++-14

    CMAKE_GENERATOR: Ninja
    CMAKE_BUILD_PARALLEL_LEVEL: "2"
    CMAKE_ARGS: >-
      -DUSE_STATIC_LINK=OFF
      -DBUILD_DOC=OFF
      -DCMAKE_BUILD_TYPE=Release

    REDIS_URL: "redis://redis:6379/15"

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      gcc-14
      g++-14
      ca-certificates
    - rm -rf /var/lib/apt/lists/*
    - mkdir -p reports

  script:
    - echo "Sync full environment and build Newclid/Yuclid"
    - uv sync --frozen -v

    - echo "Run backend integration tests"
    - uv run pytest backend/tests/integration -q --junitxml=reports/pytest-backend-integration.xml

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/pytest-backend-integration.xml


docs-build-linux:
  stage: test
  timeout: 30m
  image: ghcr.io/astral-sh/uv:0.11.11-python3.12-trixie-slim

  interruptible: true

  rules:
    - changes:
        - docs/**/*
        - README.rst
        - pyproject.toml
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  variables:
    DEBIAN_FRONTEND: noninteractive

    CC: gcc-14
    CXX: g++-14

    CMAKE_GENERATOR: Ninja
    CMAKE_BUILD_PARALLEL_LEVEL: "2"
    CMAKE_ARGS: >-
      -DUSE_STATIC_LINK=OFF
      -DBUILD_DOC=OFF
      -DCMAKE_BUILD_TYPE=Release

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      build-essential
      cmake
      ninja-build
      libboost-all-dev
      gcc-14
      g++-14
      ca-certificates
    - rm -rf /var/lib/apt/lists/*

  script:
    - echo "Install project and documentation dependencies"
    - uv sync --frozen --extra doc -v

    - echo "Generate API documentation and build Sphinx docs"
    - uv run python docs/reformat.py

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - docs/_build/html/

frontend-backend-e2e-tests-linux:
  stage: integration
  timeout: 25m
  image: node:22-bookworm-slim

  interruptible: true

  rules:
    - exists:
        - frontend/tests/e2e/**/*
      changes:
        - frontend/**/*
        - backend/**/*
        - uv.lock
        - .gitlab-ci.yml
    - when: never

  services:
    - name: redis:7-alpine
      alias: redis

  variables:
    DEBIAN_FRONTEND: noninteractive
    REDIS_URL: "redis://redis:6379/15"
    NEWCLID_QUEUE_NAME: "newclid"
    FRONTEND_BASE_URL: "http://127.0.0.1:5173"
    BACKEND_BASE_URL: "http://127.0.0.1:8000"
    PLAYWRIGHT_JUNIT_OUTPUT_NAME: "../reports/e2e-junit.xml"

  before_script:
    - apt-get update -qq
    - >
      apt-get install -y --no-install-recommends
      ca-certificates
      curl
      python3
      python3-venv
    - rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mkdir -p "$CI_PROJECT_DIR/reports"

  script:
    - echo "Create backend environment"
    - cd "$CI_PROJECT_DIR"
    - uv venv
    - uv pip install -e "backend[test]"

    - echo "Install frontend dependencies"
    - cd "$CI_PROJECT_DIR/frontend"
    - npm ci
    - npx playwright install --with-deps chromium
    - cd "$CI_PROJECT_DIR"

    - echo "Wait for Redis"
    - |
      .venv/bin/python - <<'PY'
      import os
      import time
      from redis import Redis

      redis = Redis.from_url(os.environ["REDIS_URL"])

      for _ in range(30):
          try:
              redis.ping()
              print("Redis is ready")
              break
          except Exception:
              time.sleep(1)
      else:
          raise SystemExit("Redis did not become ready")
      PY

    - echo "Start backend"
    - >
      REDIS_URL="$REDIS_URL"
      NEWCLID_QUEUE_NAME="$NEWCLID_QUEUE_NAME"
      "$CI_PROJECT_DIR/.venv/bin/python" -m uvicorn newclid_backend.main:app
      --app-dir "$CI_PROJECT_DIR/backend/src"
      --host 0.0.0.0
      --port 8000
      > "$CI_PROJECT_DIR/reports/backend-e2e.log" 2>&1 &
    - export BACKEND_PID=$!

    - echo "Start frontend"
    - >
      cd "$CI_PROJECT_DIR/frontend" &&
      npm run dev -- --host 0.0.0.0 --port 5173
      > "$CI_PROJECT_DIR/reports/frontend-e2e.log" 2>&1 &
    - export FRONTEND_PID=$!
    - cd "$CI_PROJECT_DIR"

    - echo "Wait for backend and frontend"
    - |
      cleanup() {
        kill "$BACKEND_PID" "$FRONTEND_PID" 2>/dev/null || true
      }
      trap cleanup EXIT

      for i in $(seq 1 30); do
        if curl -sf "$BACKEND_BASE_URL/api/health" >/dev/null; then
          echo "Backend is ready"
          break
        fi
        sleep 1
      done
      curl -sf "$BACKEND_BASE_URL/api/health" >/dev/null

      for i in $(seq 1 30); do
        if curl -sf "$FRONTEND_BASE_URL" >/dev/null; then
          echo "Frontend is ready"
          break
        fi
        sleep 1
      done
      curl -sf "$FRONTEND_BASE_URL" >/dev/null

    - echo "Run frontend-backend E2E tests"
    - cd "$CI_PROJECT_DIR/frontend"
    - npm run test:e2e:frontend-backend

  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - reports/e2e-junit.xml
    paths:
      - reports/backend-e2e.log
      - reports/frontend-e2e.log
      - frontend/test-results/
      - frontend/playwright-report/
